name: Jarvis

on:
  push:
    branches: [main]
    paths:
      - workers/jarvis.js
      - wrangler.toml
      - .github/workflows/jarvis.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Jarvis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$XAI_API_KEY" ]; then
            echo "Sin token de servidor; se omite el despliegue."
            exit 0
          fi
          npm i -g wrangler@4
          echo "$XAI_API_KEY" | wrangler secret put XAI_API_KEY --name iaspor-jarvis
          wrangler deploy
