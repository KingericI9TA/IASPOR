name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Icono IASPOR
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu-core
          convert -size 512x512 xc:'#020617' \
            -font DejaVu-Sans-Bold -pointsize 108 -gravity center \
            -fill '#0b4f8c' -annotate +0+10 'IASPOR' \
            -fill '#1a9fff' -annotate +0+3 'IASPOR' \
            -fill '#f0f6ff' -annotate +0-5 'IASPOR' \
            public/icon-512.png
          convert public/icon-512.png -resize 192x192 public/icon-192.png
          convert public/icon-512.png -resize 180x180 public/__grok/icon-180.png
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        env:
          NITRO_PRESET: github_pages
          NITRO_APP_BASE_URL: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_JARVIS_URL: ${{ secrets.JARVIS_URL }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Liberar despliegue anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/22973e05c8fbe9cf0599b9a4af0d8ad1849897d4/cancel" || true
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/4218792c6045df9354134af5a2fe284e4eaea1f0/cancel" || true
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: "600000"
